name: Replay quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v5
        with:
          go-version-file: market-go/go.mod
          cache-dependency-path: market-go/go.sum
      - run: cd market-go && go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m venv .venv && .venv/bin/pip install -r replay/backend/requirements-dev.txt
      - run: npm ci --prefix frontend
      - run: scripts/check
      - run: .venv/bin/python scripts/ci-data.py
      - run: PURPLE_REPLAY_PORT=18948 docker compose -p purple-replay-ci up -d --build
      - run: python scripts/check-install.py http://127.0.0.1:18948
      - run: docker compose -p purple-replay-ci exec -T -e TEST_ADMIN_DSN=postgresql://postgres:demo-install-only@database/replay replay python < scripts/check-postgres.py
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: REPLAY_URL=http://127.0.0.1:18948 node scripts/check-browser.mjs
      - name: Check runtime isolation
        run: |
          docker compose -p purple-replay-ci exec -T replay python -c "import importlib.util; assert not importlib.util.find_spec('httpx'); assert not importlib.util.find_spec('pytest'); routes=open('/proc/net/route').readlines()[1:]; assert not any(r.split()[1]=='00000000' for r in routes)"
      - name: Diagnostic logs
        if: failure()
        run: docker compose -p purple-replay-ci logs --tail=80
      - name: Cleanup test installation
        if: always()
        run: docker compose -p purple-replay-ci down -v
