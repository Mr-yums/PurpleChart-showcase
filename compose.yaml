name: purple-replay
services:
  replay:
    build: .
    image: purple-replay:1.1.0
    ports:
      - "127.0.0.1:${PURPLE_REPLAY_PORT:-8948}:8080"
    volumes:
      - ./data:/market:ro
      - journals:/state
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    networks: [replay]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
networks:
  replay:
    driver: bridge
    internal: true
volumes:
  journals:
